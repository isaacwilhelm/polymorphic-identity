name: Check Lean proofs
on: [push, pull_request]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean files
        working-directory: lean
        run: |
          lean --version
          out=$(lake build 2>&1); echo "$out"
          if echo "$out" | grep -E "error|warning|sorry"; then exit 1; fi
      - name: Check that the site's Lean references are real declarations
        run: |
          python3 tools/check_lean_refs.py --check --leanfile lean/Refs.lean
          out=$(cd lean && lake env lean Refs.lean 2>&1 | grep -i error || true); echo "$out"
          test -z "$out"
