name: Check Lean proofs
on: [push, pull_request]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check PIFoundation.lean
        working-directory: lean
        run: |
          lean --version
          out=$(lean PIFoundation.lean 2>&1); echo "$out"
          test -z "$out"
      - name: Check that the site's Lean references are real declarations
        run: |
          python3 tools/check_lean_refs.py --check --leanfile /tmp/refs.lean
          out=$(cd lean && lean /tmp/refs.lean 2>&1 | grep -i error || true); echo "$out"
          test -z "$out"
